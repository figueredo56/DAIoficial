<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAARD INNOVATION | ZARD Web</title>
    
    <!-- Meta tags para compartir en Redes Sociales y WhatsApp (Open Graph) -->
    <meta property="og:title" content="ZAARD INNOVATION | Ecosistema ZARD">
    <meta property="og:description" content="Sitio oficial del token ZARD en la BNB Smart Chain. Únete al ecosistema Web3.">
    <meta property="og:image" content="https://raw.githubusercontent.com/zaard-official/assets/main/zard-logo.png"> <!-- Reemplaza este enlace con la URL directa de tu imagen/logo -->
    <meta property="og:url" content="https://zaard-official.github.io/zard/">
    <meta property="og:type" content="website">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="ZAARD INNOVATION | Ecosistema ZARD">
    <meta name="twitter:description" content="Sitio oficial del token ZARD en la BNB Smart Chain.">
    <meta name="twitter:image" content="https://raw.githubusercontent.com/zaard-official/assets/main/zard-logo.png">

    <style>
        :root {
            --primary-color: #00ffcc;
            --secondary-color: #ff007f;
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --text-color: #ffffff;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo-container {
            width: 100px;
            height: 100px;
            margin: 0 auto 15px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid var(--primary-color);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-size: 2.2rem;
            color: var(--primary-color);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: fenixBlinkAlt 2s infinite ease-in-out;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid rgba(0, 255, 204, 0.2);
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            text-align: center;
            margin-bottom: 30px;
        }

        .contract-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 12px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.9rem;
            color: var(--primary-color);
            word-break: break-all;
            margin: 20px 0;
            border: 1px dashed var(--primary-color);
        }

        .btn {
            background: linear-gradient(135deg, var(--primary-color), #00b386);
            color: #0b0f19;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            margin: 10px 5px;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 255, 204, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(135deg, var(--secondary-color), #b30059);
            color: #ffffff;
        }

        footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            padding: 10px 0;
        }

        @keyframes fenixBlinkAlt {
            0%, 100% {
                opacity: 1;
                text-shadow: 0 0 10px rgba(0, 255, 204, 0.6);
            }
            50% {
                opacity: 0.6;
                text-shadow: 0 0 2px rgba(0, 255, 204, 0.2);
            }
        }
    </style>
</head>
<body>
    

    <header>
        <!-- Contenedor visual del Logo -->
        <div class="logo-container">
            <img src="https://raw.githubusercontent.com/zaard-official/assets/main/zard-logo.png" alt="ZARD Logo">
        </div>
        <h1>ZAARD INNOVATION</h1>
        <p class="subtitle">Ecosistema Web3 & Token ZARD</p>
    </header>

    <div class="container">
        <h2>Contrato Oficial ZARD</h2>
        <p style="margin-top: 10px; color: var(--text-muted);">Red: BNB Smart Chain (BSC)</p>
        
        <div class="contract-box" id="contractAddress">
            0x973ba2c1dccd0820f1e026d6b1f01c55c4085d38
        </div>

        <button class="btn" onclick="copyContract()">Copiar Contrato</button>
        <button class="btn btn-secondary" onclick="addTokenToWallet()">Agregar a MetaMask</button>
    </div>

    <footer>
        &copy; 2026 ZAARD INNOVATION - Todos los derechos reservados.
    </footer>

    <script>
        const contractAddress = "0x973ba2c1dccd0820f1e026d6b1f01c55c4085d38";

        function copyContract() {
            navigator.clipboard.writeText(contractAddress).then(() => {
                alert("¡Dirección de contrato copiada al portapapeles!");
            }).catch(err => {
                console.error("Error al copiar: ", err);
            });
        }

        async function addTokenToWallet() {
            if (window.ethereum) {
                try {
                    const wasAdded = await window.ethereum.request({
                        method: 'wallet_watchAsset',
                        params: {
                            type: 'ERC20',
                            options: {
                                address: contractAddress,
                                symbol: 'ZARD',
                                decimals: 18,
                                image: 'https://raw.githubusercontent.com/zaard-official/assets/main/zard-logo.png',
                            },
                        },
                    });
                    if (wasAdded) {
                        alert('¡ZARD se ha añadido correctamente a tu billetera!');
                    }
                } catch (error) {
                    console.error(error);
                }
            } else {
                alert('No se detectó una billetera Web3 (como MetaMask).');
            }
        }
    </script>

</body>
</html>
